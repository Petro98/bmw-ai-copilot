<section class="block" aria-labelledby="car-now">
  <h2 class="phone-label heading" id="car-now">{{ heading() }}</h2>
  @if (dataNote(); as note) {
    <p class="note" role="status" data-data-note>{{ note }}</p>
  }
  <div class="tiles">
    @for (tile of tiles(); track tile.label) {
      <app-reading-tile [label]="tile.label" [reading]="tile.reading" [target]="tile.target" [now]="now()"
        [unavailableNote]="tileNote()" />
    }
  </div>
</section>

<section class="block" aria-labelledby="car-alerts">
  <h2 class="phone-label heading" id="car-alerts">СПОВІЩЕННЯ</h2>
  @if (alerts().length > 0) {
    <ul class="alerts">
      @for (alert of alerts(); track alert.id) {
        <li><app-alert-row [alert]="alert" [now]="clock()" /></li>
      }
    </ul>
  } @else if (!alertsLoaded()) {
    <p class="empty" role="status" data-not-loaded>{{ alertsNote() }}</p>
  } @else {
    <p class="empty" data-empty>Сповіщень немає</p>
  }
</section>
