# Phone panel: the static Angular build plus a reverse proxy for the backend API (same origin, so no CORS).
# `backend` is the service name in docker-compose.yml.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The API, including the two event streams (GET /api/events and POST /api/ask/stream).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Server-sent events: pass every chunk on at once and keep the stream open; the backend sends a
        # keep-alive comment every 25 s, well inside this read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # A question is at most 500 characters; the backend refuses bodies over 16 KiB itself.
        client_max_body_size 32k;
    }

    # Hashed bundles can be cached for long; index.html must not be, so a new build is picked up.
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Client-side routes (/car, /settings) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
