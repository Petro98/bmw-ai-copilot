# Phone panel: the static Angular build plus a reverse proxy for the backend API (same origin, so no CORS).
# `backend` is the service name in docker-compose.yml.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Basic security headers on every response. nginx drops server-level add_header lines in any location that has
    # its own add_header, so each such location below repeats these two.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The API, including the two event streams (GET /api/events and POST /api/ask/stream). `^~`: no regex location
    # (such as the long-cache rule for *.js below) may take an API path away from the proxy.
    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Server-sent events: pass every chunk on at once and keep the stream open; the backend sends a
        # keep-alive comment every 25 s, well inside this read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # A question is at most 500 characters; the backend refuses bodies over 16 KiB itself.
        client_max_body_size 32k;
    }

    # The car link: the head unit reaches the backend through the panel's address. Only /car/v1/ — plain /car is
    # the panel's own «Авто» screen and falls through to the app shell below. `^~` as for /api/.
    location ^~ /car/v1/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # GET /car/v1/dialog is a long poll of at most 25 s (DIALOG_WAIT_MS in
        # apps/backend/src/features/car-link/routes.ts); this leaves a wide margin above it.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        # Snapshot and alert uploads; the backend refuses bodies over 512 KiB itself (CAR_BODY_LIMIT_BYTES).
        client_max_body_size 1m;
    }

    # The app shell and the service worker must be revalidated on every load, so a new build takes over at once.
    # Exact matches win over the long-cache rule for *.js below.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /copilot-sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /safety-worker.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /worker-basic.min.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Hashed bundles can be cached for long; index.html must not be, so a new build is picked up.
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Client-side routes (/car, /settings, /login, /pair) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
